# Render Blueprint: one-click deploy of Vikas OS (free plan)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vikas-os
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # PHPMailer SMTP (Gmail). Secret values are entered in the Render dashboard.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_USER          # Gmail address
        sync: false
      - key: SMTP_PASS          # 16-character Gmail app password
        sync: false
      - key: SMTP_FROM_NAME
        value: Vikas Rambaul Giri
      - key: MAIL_TO
        value: vikasr.giri@outlook.com
