# Render Blueprint: one-click deploy of Vikas OS (free plan)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: vikas-os
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /assets/img/favicon.svg   # static file: no PHP session per health check
    envVars:
      # Gmail relay (Google Apps Script, HTTPS). Render free blocks SMTP, so this is used in production.
      # Setup: deploy/gmail-relay.gs
      - key: GMAIL_RELAY_URL     # Apps Script web app URL (…/exec)
        sync: false
      - key: GMAIL_RELAY_SECRET  # same value as RELAY_SECRET in the Apps Script
        sync: false
      # PHPMailer SMTP (Gmail), used only when the relay is not set and the host allows SMTP.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: tls
      - key: SMTP_USER          # Gmail address
        sync: false
      - key: SMTP_PASS          # 16-character Gmail app password
        sync: false
      - key: SMTP_FROM_NAME
        value: Vikas Rambaul Giri
      - key: MAIL_TO
        value: vikasr.giri@outlook.com
      - key: DIAG_TOKEN         # optional: enables /mail-test.php?token=… (remove when done)
        sync: false
